plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hbdxm.ddprobe'
    compileSdk 34

    defaultConfig {
        applicationId "com.hbdxm.ddprobe"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 没有 dependencies —— 探测只用 Android 框架自带的无障碍 API。
