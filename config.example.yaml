# 数据落库
storage:
  # 相对本配置文件的路径
  db_path: "data/bridge.db"

# 钉钉采集端
dingtalk:
  # stream = 官方长连接事件订阅（需自建应用+机器人，无需公网IP；但只收得到 @机器人 的消息）
  # ocr    = 截屏 + OCR 读取钉钉客户端（能拿到群内全部消息，需窗口处于打开状态）
  # ui     = 读钉钉客户端控件树（实测不可用，消息不进无障碍树，仅存档）
  # probe  = 仅探测能力，不采集（python probe_dingtalk.py 使用）
  mode: "ocr"

  # 敏感凭证建议改用环境变量：
  #   DINGTALK_CLIENT_ID / DINGTALK_CLIENT_SECRET / DINGTALK_ROBOT_CODE
  client_id: ""
  client_secret: ""
  robot_code: ""

  # 只转发这些公司的消息，留空表示不限
  companies:
    - "示例科技有限公司"

  # 只转发这些会话的消息，留空表示不限
  chat_names: []

  # ---- 以下为 ocr 模式专用 ----
  # ocr 轮询间隔（秒）。越小越不漏消息，但一帧 OCR 约 2.5s，不建议低于 5
  ui_poll_interval: 5.0

  # 安全护栏：每帧 OCR 窗口标题，与 chat_names 模糊匹配；不匹配则整帧丢弃
  title_check: true
  title_ratio: 0.55

  # 时间过滤：today = 丢弃被钉钉标记为「昨天/星期X/MM-DD」的跨天消息；any = 不限
  time_filter: "today"

  # 锚点防护：只转发「上一帧靠下位置那条消息」下方的新内容，
  # 防止聊天区被滚动时把历史消息误当成新消息发出去
  anchor_guard: true

# 微信投递端
wechat:
  # true = 只打印不真发，用于联调；确认无误后改 false
  dry_run: true
  # 相邻两条消息的最小发送间隔（秒），防风控，建议不低于 3
  interval: 3.0
  wxauto_path: "../wxauto-main"
  # 微信「设置 → 快捷键 → 显示/隐藏主窗口」的快捷键（默认 Ctrl+Alt+W）。
  # 微信窗口被收进托盘时（按了 Esc、或点了最小化），程序会发这个快捷键把
  # 窗口唤回来；如果你在微信里改过快捷键，这里要跟着改。
  show_hotkey: "{Ctrl}{Alt}w"

# 钉钉机器人通知（故障告警 + 运行报告）
#
# ⚠ 先说清能力边界：自定义机器人 webhook 是【单向】的 ——
#   只能往钉钉群里发消息，**收不到**群里其他人发的消息，
#   所以它不参与「钉钉 → 微信」的取数，取数仍然是上面的 ocr 截屏方案。
#   它的价值在于：这套程序最怕「静默失效」（窗口被切走就悄悄不转了），
#   有了它，出问题会主动发消息到群里，而不是等人自己发现。
#
# 获取方式：钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 自定义（Webhook）
# 安全设置三选一（三种这里都支持）：
#   自定义关键词 -> 把关键词填到下面的 keyword，缺词时会自动补一行
#   加签         -> 把密钥（SEC...）填到 secret
#   IP 白名单    -> 钉钉侧配置即可，这里不用填
notify:
  enabled: false                     # 改成 true 并填好 webhook 才生效
  # 建议改用环境变量 DINGTALK_ROBOT_WEBHOOK / DINGTALK_ROBOT_SECRET，
  # 避免把带 access_token 的地址明文写进配置文件
  webhook: "https://oapi.dingtalk.com/robot/send?access_token=改成你自己的"
  secret: ""
  keyword: ""

  # 告警时 @ 谁（填手机号）；at_all 为 true 时等同于 @所有人
  at_mobiles: []
  at_all: false

  # 同一类告警的最小间隔（秒）。采集窗口被切走时每轮都会报错，
  # 不去重会瞬间刷屏，所以这里的冷却很有必要
  cooldown: 300

  log_alerts: true                   # 采集端异常日志 → 告警（窗口最小化、找不到窗口等）
  notify_start: true                 # 开始 / 停止运行时各发一条
  notify_fail: true                  # 投递失败告警
  fail_threshold: 3                  # 连续失败几次才告警（偶发一次不打扰）

  notify_idle: true                  # 采集停滞告警
  idle_minutes: 120                  # 多久没有新消息算停滞
  idle_window: "08:00-21:00"         # 只在此时段内判定，避免夜里安静被误报

  report_hourly: false               # 每小时发一次运行报告
  report_daily_at: ""                # 每日报告时间，空 = 不发，例如 "18:00"

# 路由规则：从上到下依次匹配，命中的目标合并去重
routes:
  - name: "示例公司全部消息"
    companies: ["示例科技有限公司"]
    msg_types: []                 # 空 = 不限
    keywords: []
    targets:
      - "测试群"                   # 微信里的群名或好友备注，需完整匹配
    template: "【{company}】{sender} {time}\n{content}"

  # 示例：只转发含「加急」二字的消息到另一个群
  # - name: "加急件单独提醒"
  #   companies: ["示例科技有限公司"]
  #   keywords: ["加急", "紧急"]
  #   targets: ["调度群"]
  #   template: "⚠ {sender}：{content}"
