# 数据落库
storage:
  # 相对本配置文件的路径
  db_path: "data/bridge.db"

# 钉钉采集端
dingtalk:
  # stream = 官方长连接事件订阅（需自建应用+机器人，无需公网IP；但只收得到 @机器人 的消息）
  # ocr    = 截屏 + OCR 读取钉钉客户端（能拿到群内全部消息，需窗口处于打开状态）
  # android= 手机端无障碍读钉钉，POST 给本机网关（文本精确，需一台常开的安卓机）
  # ui     = 读钉钉客户端控件树（实测不可用，消息不进无障碍树，仅存档）
  # probe  = 仅探测能力，不采集（python probe_dingtalk.py 使用）
  mode: "ocr"

  # 敏感凭证建议改用环境变量：
  #   DINGTALK_CLIENT_ID / DINGTALK_CLIENT_SECRET / DINGTALK_ROBOT_CODE
  client_id: ""
  client_secret: ""
  robot_code: ""

  # 只转发这些公司的消息，留空表示不限
  companies:
    - "示例科技有限公司"

  # 只转发这些会话的消息，留空表示不限
  chat_names: []

  # ---- 以下为 ocr 模式专用 ----
  # ocr 轮询间隔（秒）。越小越不漏消息，但一帧 OCR 约 2.5s，不建议低于 5
  ui_poll_interval: 5.0

  # 安全护栏：每帧 OCR 窗口标题，与 chat_names 模糊匹配；不匹配则整帧丢弃
  title_check: true
  title_ratio: 0.55

  # 时间过滤：today = 丢弃被钉钉标记为「昨天/星期X/MM-DD」的跨天消息；any = 不限
  time_filter: "today"

  # 锚点防护：只转发「上一帧靠下位置那条消息」下方的新内容，
  # 防止聊天区被滚动时把历史消息误当成新消息发出去
  anchor_guard: true

  # ---- 以下为 android 模式专用 ----
  # 手机端读到的消息 POST 到这里，由本程序接手后续的转发。
  #
  # 监听地址：默认 0.0.0.0（局域网里所有网卡都听，手机才连得上）。
  # 只在本机自测时改成 127.0.0.1。
  gateway_host: "0.0.0.0"

  # 监听端口。手机端要填 http://<本机IP>:8765
  gateway_port: 8765

  # ⚠ 必填，且必须与手机端一致。
  # 能往这个端口 POST 就等于能往你的微信群发消息，所以没配 token 程序
  # 会直接拒绝启动（不做「没配就放行」）。随便一串随机字符即可，例如
  # 用 python -c "import secrets;print(secrets.token_urlsafe(24))" 生成。
  gateway_token: ""

  # 是否把手机报来的节点树解析成消息并转发。
  # false（默认）= 网关只负责「收」，程序不会转发任何东西 —— 手机报的只是画面。
  # 开启前务必先用 tools/android_capture.py 看过一帧真实画面的「解析预览」：
  #   python tools/android_capture.py
  # 只有条数与屏幕上一致、发送者与正文分得开，才把这里改成 true。
  # 开启后第一帧只建基线（一条都不发），之后只转发基线之后的新消息。
  android_parse: false
  # 手机多久没「心跳」就判为失联并告警（秒，0 = 不检测）。
  # 判据是心跳，不是「多久没收到画面」——群里半天没人说话时画面本来就不变、
  # 手机也不上报，按画面判会天天误报，误报几次之后就没人再看告警了。
  # 手机端 0.2.0 起每 60 秒发一次心跳，所以 300 秒（5 分钟）足够宽松。
  # 旧版 APK 没有心跳，此项对它不生效（只在「一次都没收到」时提醒）。
  android_offline_after: 300

# 微信投递端
wechat:
  # true = 只打印不真发，用于联调；确认无误后改 false
  dry_run: true
  # 相邻两条消息的发送间隔（秒），防风控。
  # interval 只是**下限基准**：实际间隔在 0.8~1.6 倍之间随机（5.0 即 4~8 秒），
  # 避免出现「固定 3 秒一条」这种一眼是机器人的节奏。
  interval: 5.0

  # 随机长停顿：每转发 interval_long_every 条，额外多等
  # interval_long_range 里随机的一个时长（秒），模拟真人「发几条、停一会儿」。
  # 群里刷屏时这条尤其重要 —— 连续几十条同节奏消息是被风控的重点特征。
  interval_jitter_long: true
  interval_long_every: 3
  interval_long_range: [8.0, 20.0]
  wxauto_path: "../wxauto-main"
  # 微信「设置 → 快捷键 → 显示/隐藏主窗口」的快捷键（默认 Ctrl+Alt+W）。
  # 微信窗口被收进托盘时（按了 Esc、或点了最小化），程序会发这个快捷键把
  # 窗口唤回来；如果你在微信里改过快捷键，这里要跟着改。
  show_hotkey: "{Ctrl}{Alt}w"

  # 微信客户端代际 / 投递方式：
  #   auto   -> 自动探测（推荐）。探测到微信 4.x 会自动走下面的 ocr 方式
  #   ocr    -> 截屏 + OCR 识别会话列表 + 模拟鼠标键盘（微信 4.x 唯一可用方式）
  #   wxauto -> 微信 3.9.x（走 wxauto 原版逻辑）
  #   ui4    -> 微信 4.x 的 UIA 控件树方式（仅在控件树可用时才有意义，已基本淘汰）
  #
  # 为什么 4.x 要用 ocr：微信 4.x 从 2026-10 起不再向系统暴露 mmui:: 控件树，
  # 主窗口在 Win32 层退化成一个空壳，界面上什么都看得见、但程序读不到任何控件。
  # ocr 方式用「截屏识别 + 模拟点击」代替读控件，代价是**运行期间微信窗口必须
  # 停在桌面上可见**（不能最小化、不能收进托盘，程序会自动拉到前台）。
  driver: "auto"

  # ---- 以下为 driver: ocr 专用 ----
  # 发送后回读截图，检测有没有出现绿色气泡来确认真的发出去了
  ocr_verify: true
  # 粘贴完成后把你自己原来的剪贴板内容还原回去
  ocr_keep_clipboard: true
  # 会话名模糊匹配阈值（0-1）。群名常被截断成「某某群...」，0.62 比较稳；
  # 调高 -> 更保守（宁可不发），调低 -> 更容易误认到别的群，不建议低于 0.5
  ocr_match_threshold: 0.62

  # ---- 表格转图片 ----
  # 钉钉卡片里的表格在微信没有原生类型；开着时把表格画成 PNG、在文字之后
  # 补发一张图。文字照常发，图片失败不影响文字。
  table_image: true

# 钉钉机器人通知（故障告警 + 运行报告）
#
# ⚠ 先说清能力边界：自定义机器人 webhook 是【单向】的 ——
#   只能往钉钉群里发消息，**收不到**群里其他人发的消息，
#   所以它不参与「钉钉 → 微信」的取数，取数仍然是上面的 ocr 截屏方案。
#   它的价值在于：这套程序最怕「静默失效」（窗口被切走就悄悄不转了），
#   有了它，出问题会主动发消息到群里，而不是等人自己发现。
#
# 获取方式：钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 自定义（Webhook）
# 安全设置三选一（三种这里都支持）：
#   自定义关键词 -> 把关键词填到下面的 keyword，缺词时会自动补一行
#   加签         -> 把密钥（SEC...）填到 secret
#   IP 白名单    -> 钉钉侧配置即可，这里不用填
notify:
  enabled: false                     # 改成 true 并填好 webhook 才生效

  # ---- 机器人（可以配多个，通知会同时发给每一个）----
  # 一个群里常常不止一个机器人（每个上游系统挂一个），所以这里做成列表：
  # 一行一个机器人。每项写法：  地址 | 加签密钥 | 自定义关键词
  # 后两段可以省略（省略就回落到下面的 secret / keyword）。
  # 谁配错了不影响其它机器人：发失败的那几个会各自记一条 WARNING，
  # 只要有一个发成功，告警的冷却机制就照常生效，不会刷屏。
  webhooks:
    - "https://oapi.dingtalk.com/robot/send?access_token=改成你自己的"
    # - "https://oapi.dingtalk.com/robot/send?access_token=第二个机器人 | SECxxxx | 转发桥"

  # 建议改用环境变量避免明文：
  #   DINGTALK_ROBOT_WEBHOOKS  分号隔开的多个地址（推荐）
  #   DINGTALK_ROBOT_WEBHOOK   单个地址
  #   DINGTALK_ROBOT_SECRET    加签密钥（webhooks 某项没写自己的密钥时用它）

  # ---- 下面两项是上面 webhooks 里没单独写时的**默认值** ----
  webhook: ""                        # 老格式：单个地址，配了 webhooks 就忽略它
  secret: ""                         # 默认加签密钥（SEC 开头）
  keyword: ""                        # 默认自定义关键词

  # 告警时 @ 谁（填手机号）；at_all 为 true 时等同于 @所有人
  at_mobiles: []
  at_all: false

  # 同一类告警的最小间隔（秒）。采集窗口被切走时每轮都会报错，
  # 不去重会瞬间刷屏，所以这里的冷却很有必要
  cooldown: 300

  log_alerts: true                   # 采集端异常日志 → 告警（窗口最小化、找不到窗口等）
  notify_start: true                 # 开始 / 停止运行时各发一条
  notify_fail: true                  # 投递失败告警
  fail_threshold: 3                  # 连续失败几次才告警（偶发一次不打扰）

  notify_idle: true                  # 采集停滞告警
  idle_minutes: 120                  # 多久没有新消息算停滞
  idle_window: "08:00-21:00"         # 只在此时段内判定，避免夜里安静被误报

  report_hourly: false               # 每小时发一次运行报告
  report_daily_at: ""                # 每日报告时间，空 = 不发，例如 "18:00"

# 路由规则：从上到下依次匹配，命中的目标合并去重
routes:
  - name: "示例公司全部消息"
    companies: ["示例科技有限公司"]
    msg_types: []                 # 空 = 不限
    keywords: []
    targets:
      - "测试群"                   # 微信里的群名或好友备注，需完整匹配
    template: "【{company}】{sender} {time}\n{content}"

  # 示例：只转发含「加急」二字的消息到另一个群
  # - name: "加急件单独提醒"
  #   companies: ["示例科技有限公司"]
  #   keywords: ["加急", "紧急"]
  #   targets: ["调度群"]
  #   template: "⚠ {sender}：{content}"
